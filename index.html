
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CARELINK | Emergency Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f3f6fb;
      color: #172033;
    }

    header {
      background: #102544;
      color: white;
      padding: 22px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    header h1 {
      font-size: 28px;
      letter-spacing: 1px;
    }

    header p {
      color: #cbd8eb;
      margin-top: 5px;
      font-size: 14px;
    }

    .connection {
      background: #293e5c;
      padding: 10px 14px;
      border-radius: 20px;
      font-size: 13px;
    }

    main {
      max-width: 1050px;
      margin: 32px auto;
      padding: 0 20px;
    }

    .welcome {
      margin-bottom: 24px;
    }

    .welcome h2 {
      font-size: 25px;
      margin-bottom: 8px;
    }

    .welcome p {
      color: #68758b;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 4px 18px #1527470d;
      border: 1px solid #e5eaf2;
    }

    .card h3 {
      margin-bottom: 18px;
      font-size: 18px;
    }

    .status-box {
      background: #e8f7ee;
      color: #176b3a;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 18px;
    }

    .status-box.alert {
      background: #ffebeb;
      color: #b42323;
    }

    .status-box.acknowledged {
      background: #e8f7ee;
      color: #176b3a;
    }

    .status-box h4 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .status-box p {
      font-size: 14px;
      line-height: 1.5;
    }

    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 12px 16px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }

    button:focus-visible {
      outline: 3px solid #7aa7ff;
      outline-offset: 3px;
    }

    .sos-btn {
      background: #d92d35;
      color: white;
    }

    .ack-btn {
      background: #18864b;
      color: white;
    }

    .reset-btn {
      background: #e9edf4;
      color: #26364d;
    }

    button:hover {
      filter: brightness(0.94);
    }

    .detail {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 0;
      border-bottom: 1px solid #edf0f5;
      font-size: 14px;
    }

    .detail span {
      color: #68758b;
    }

    .detail strong {
      text-align: right;
      overflow-wrap: anywhere;
    }

    .history-list {
      list-style: none;
    }

    .history-list li {
      border-bottom: 1px solid #edf0f5;
      padding: 13px 0;
      font-size: 14px;
      line-height: 1.5;
    }

    .empty {
      color: #68758b;
    }

    footer {
      text-align: center;
      color: #68758b;
      font-size: 12px;
      padding: 28px 16px;
    }

    @media (max-width: 650px) {
      .grid {
        grid-template-columns: 1fr;
      }

      header h1 {
        font-size: 24px;
      }
    }
  </style>
</head>


  
<script type="module">
  import { initializeApp } from
    "https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js";

  import {
    getDatabase,
    ref,
    onValue,
    push,
    set,
    update,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.5.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "PASTE_YOUR_API_KEY",
    authDomain: "carelink-emergency.firebaseapp.com",
    databaseURL: "https://carelink-emergency-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "carelink-emergency",
    storageBucket: "carelink-emergency.firebasestorage.app",
    messagingSenderId: "913907197319",
    appId: "1:913907197319:web:549f9f7bf8c1ccc3b55f22"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const alertRef = ref(db, "carelink/currentAlert");
  const historyRef = ref(db, "carelink/events");

  const statusBox = document.getElementById("statusBox");
  const statusTitle = document.getElementById("statusTitle");
  const statusMessage = document.getElementById("statusMessage");
  const alertTime = document.getElementById("alertTime");
  const responseStatus = document.getElementById("responseStatus");
  const ackButton = document.getElementById("ackButton");
  const connection = document.getElementById("connection");
  const historyList = document.getElementById("history");

  function logEvent(message) {
    return push(historyRef, {
      message,
      timestamp: Date.now()
    });
  }

  function showAlert(alert) {
    const active = alert?.active === true;
    const acknowledged = alert?.acknowledged === true;

    if (active && acknowledged) {
      statusBox.className = "status-box acknowledged";
      statusTitle.textContent = "✓ Alert Acknowledged";
      statusMessage.textContent = "A helper acknowledged this alert.";
      responseStatus.textContent = "Acknowledged";
    } else if (active) {
      statusBox.className = "status-box alert";
      statusTitle.textContent = "⚠ SOS ALERT ACTIVE";
      statusMessage.textContent =
        "Assistance requested. Awaiting acknowledgement.";
      responseStatus.textContent = "Awaiting acknowledgement";
    } else {
      statusBox.className = "status-box";
      statusTitle.textContent = "✓ No Active Emergency";
      statusMessage.textContent = "No active SOS alert.";
      responseStatus.textContent = "Waiting";
    }

    alertTime.textContent = alert?.timestamp
      ? new Date(alert.timestamp).toLocaleString()
      : "—";

    ackButton.disabled = !active || acknowledged;
  }

  onValue(alertRef, snapshot => {
    showAlert(snapshot.val());
    connection.textContent = "● Firebase Connected";
  }, error => {
    connection.textContent = "● Firebase Error";
    console.error("Alert listener failed:", error);
  });

  onValue(historyRef, snapshot => {
    historyList.replaceChildren();
    const records = [];

    snapshot.forEach(child => {
      records.push(child.val());
    });

    records.reverse().slice(0, 8).forEach(event => {
      const item = document.createElement("li");
      item.textContent =
        new Date(event.timestamp).toLocaleString() + " — " +
        event.message;
      historyList.appendChild(item);
    });

    if (records.length === 0) {
      const item = document.createElement("li");
      item.className = "empty";
      item.textContent = "No events recorded yet.";
      historyList.appendChild(item);
    }
  }, error => {
    console.error("History listener failed:", error);
  });

  document.getElementById("sosButton").addEventListener("click", async () => {
    try {
      const alert = {
        active: true,
        acknowledged: false,
        timestamp: Date.now(),
        source: "web-dashboard"
      };

      await set(alertRef, alert);
      await logEvent("SOS alert activated from dashboard");
    } catch (error) {
      alert("Could not send alert. Check Firebase access and internet.");
      console.error(error);
    }
  });

  ackButton.addEventListener("click", async () => {
    try {
      const snapshot = await import(
        "https://www.gstatic.com/firebasejs/12.5.0/firebase-database.js"
      ).then(module => module.get(ref(db, "carelink/currentAlert")));

      const alert = snapshot.val();
      if (!alert?.active || alert.acknowledged) return;

      await update(alertRef, {
        acknowledged: true,
        acknowledgedAt: Date.now()
      });

      await logEvent("SOS alert acknowledged");
    } catch (error) {
      alert("Could not acknowledge alert. Check Firebase access.");
      console.error(error);
    }
  });

  document.getElementById("resetButton").addEventListener("click", async () => {
    try {
      await set(alertRef, {
        active: false,
        acknowledged: false,
        timestamp: null,
        source: "web-dashboard"
      });

      await logEvent("Dashboard reset");
    } catch (error) {
      alert("Could not reset. Check Firebase access.");
      console.error(error);
    }
  });
</script>
</body>
</html>
